# ============================================================
#  easyTenancy Global OS — Microsoft Foundry CI/CD Pipeline
#  Version: 3.0.0
#
#  Architecture: 5-stage pipeline (Microsoft Foundry reference)
#  ┌─────────────────────────────────────────────────────────┐
#  │  Stage 1: CI Build   — TypeScript, lint, unit tests     │
#  │  Stage 2: CI Eval    — Quality gates (20-scenario set)  │
#  │  Stage 3: CD Dev     — Deploy + smoke test              │
#  │  Stage 4: CD Test    — Scenario eval + human approval   │
#  │  Stage 5: CD Prod    — Promote + enable endpoint        │
#  └─────────────────────────────────────────────────────────┘
#
#  Security: OIDC Workload Identity Federation
#  No stored Azure credentials — all auth via short-lived OIDC tokens
#
#  Required secrets (GitHub → Settings → Secrets → Actions):
#    CLOUDFLARE_API_TOKEN            — Cloudflare Pages deploy token
#    AZURE_CLIENT_ID                 — OIDC app registration client ID
#    AZURE_TENANT_ID                 — Azure tenant ID
#    AZURE_SUBSCRIPTION_ID           — Azure subscription ID
#    FOUNDRY_PROJECT_ENDPOINT_DEV    — Dev Foundry project endpoint
#    FOUNDRY_PROJECT_ENDPOINT_TEST   — Test Foundry project endpoint
#    FOUNDRY_PROJECT_ENDPOINT_PROD   — Prod Foundry project endpoint
#
# ============================================================

name: easyTenancy — Foundry CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_eval:
        description: "Skip evaluation gates (emergency deploy)"
        type: boolean
        default: false
      target_env:
        description: "Highest environment to deploy to"
        type: choice
        options: [dev, test, production]
        default: production

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables
env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  CLOUDFLARE_ACCOUNT_ID: "9a1537893b0f5d5caefb838e6059aa9a"
  CLOUDFLARE_PROJECT_NAME: "easy-tenancy-global-os"
  AGENT_CONFIG: "agent.yaml"
  EVAL_RESULTS_CI: "eval/results/results.json"
  EVAL_RESULTS_TEST: "eval/results/test-results.json"
  GATE_REPORT_CI: "eval/results/gate-report-ci.json"
  GATE_REPORT_TEST: "eval/results/gate-report-test.json"

# ══════════════════════════════════════════════════════════════
#  STAGE 1: CI BUILD
#  Runs on every push and PR
#  Steps: checkout → install → typecheck → lint → unit tests
#         → agent YAML validation → Cloudflare Pages build
# ══════════════════════════════════════════════════════════════
jobs:
  ci-build:
    name: "CI Build — TypeScript + Static Analysis"
    runs-on: ubuntu-latest
    outputs:
      build_artifact: ${{ steps.build-info.outputs.artifact_path }}
      git_sha_short:  ${{ steps.build-info.outputs.git_sha_short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for accurate change detection

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Install Python evaluation dependencies
        run: |
          pip install --quiet -r requirements-eval.txt

      # ── Static analysis ─────────────────────────────────────────
      - name: TypeScript type-check (0 errors required)
        run: npm run typecheck
        # Enforces: npx tsc --noEmit must exit 0

      - name: Python linting with ruff
        run: |
          ruff check scripts/ tests/ --output-format=github
        continue-on-error: false

      - name: Python security scan with bandit
        run: |
          bandit -r scripts/ tests/ -ll -f json -o eval/results/bandit-report.json || true
          bandit -r scripts/ tests/ -ll --exit-zero
        # -ll = medium severity and above; --exit-zero for summary

      # ── Agent YAML schema validation ─────────────────────────────
      - name: Validate agent.yaml
        run: |
          python scripts/validate_agent_config.py \
            --config ${{ env.AGENT_CONFIG }} \
            --json-output | tee eval/results/config-validation.json
          echo "Exit code: $?"

      # ── Unit tests (Vitest for TypeScript, pytest for Python) ─────
      - name: Run TypeScript unit tests
        run: npm run test:unit
        # vitest --project unit

      - name: Run Python unit tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --junit-xml=eval/results/unit-test-results.xml

      - name: Run Python tool integration tests
        run: |
          pytest tests/tools/ -v --tb=short \
            --junit-xml=eval/results/tool-test-results.xml

      # ── Build for Cloudflare Pages ────────────────────────────────
      - name: Build easyTenancy (Vite + Wrangler)
        run: npm run build
        # Outputs: dist/_worker.js, dist/_routes.json, dist/assets/

      - name: Capture build info
        id: build-info
        run: |
          echo "artifact_path=dist" >> $GITHUB_OUTPUT
          echo "git_sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_size=$(du -sh dist/ | cut -f1)" >> $GITHUB_OUTPUT

      # ── Upload build artefact (used by all downstream CD stages) ──
      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-results-${{ github.sha }}
          path: eval/results/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "CI Build Test Results"
          path: "eval/results/*-test-results.xml"
          reporter: java-junit
          fail-on-error: false

# ══════════════════════════════════════════════════════════════
#  STAGE 2: CI EVALUATION GATE
#  Runs golden dataset evaluation (20 scenarios)
#  Fails pipeline if any threshold is breached
#  Skipped on PRs from forks (no secrets access)
# ══════════════════════════════════════════════════════════════
  ci-evaluate:
    name: "CI Evaluate — Quality Gates"
    runs-on: ubuntu-latest
    needs: [ci-build]
    if: |
      success() &&
      github.event_name != 'workflow_dispatch' ||
      !inputs.skip_eval

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install evaluation dependencies
        run: pip install --quiet -r requirements-eval.txt

      - name: Create results directory
        run: mkdir -p eval/results

      # ── Azure OIDC login (if credentials available) ───────────────
      - name: Azure login (OIDC — no stored credentials)
        id: azure-login
        if: |
          secrets.AZURE_CLIENT_ID != '' &&
          secrets.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true   # Fall back to simulation if creds not yet configured

      # ── Run evaluation (live or simulation) ───────────────────────
      - name: Run golden dataset evaluation
        run: |
          python scripts/run_evaluations.py \
            --dataset ${{ env.AGENT_CONFIG == 'agent.yaml' && 'eval/datasets/golden_set.jsonl' || 'eval/datasets/golden_set.jsonl' }} \
            --dataset eval/datasets/golden_set.jsonl \
            --output  ${{ env.EVAL_RESULTS_CI }} \
            --environment ci \
            --git-sha ${{ github.sha }}

      # ── Enforce CI quality gates ──────────────────────────────────
      - name: Check CI evaluation gates
        run: |
          python scripts/check_eval_gates.py \
            --results              ${{ env.EVAL_RESULTS_CI }} \
            --max-hallucination    0.05 \
            --min-task-completion  0.90 \
            --min-groundedness     0.95 \
            --max-latency-p95      4000 \
            --environment          ci \
            --report-path          ${{ env.GATE_REPORT_CI }}

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-eval-results-${{ github.sha }}
          path: eval/results/
          retention-days: 30

      # ── Annotate PR with evaluation summary ───────────────────────
      - name: Post evaluation summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '### easyTenancy Agent Evaluation Results\n\n';
            try {
              const results = JSON.parse(fs.readFileSync('${{ env.EVAL_RESULTS_CI }}'));
              const gate = JSON.parse(fs.readFileSync('${{ env.GATE_REPORT_CI }}'));
              const icon = gate.passed ? '✅' : '❌';
              summary += `**Status**: ${icon} ${gate.passed ? 'All gates passed' : gate.fail_count + ' gate(s) failed'}\n\n`;
              summary += `| Metric | Value | Threshold | Status |\n`;
              summary += `|--------|-------|-----------|--------|\n`;
              summary += `| Hallucination rate | ${(results.hallucination_rate * 100).toFixed(1)}% | < 5% | ${results.hallucination_rate <= 0.05 ? '✅' : '❌'} |\n`;
              summary += `| Task completion | ${(results.task_completion_rate * 100).toFixed(1)}% | > 90% | ${results.task_completion_rate >= 0.90 ? '✅' : '❌'} |\n`;
              summary += `| Grounded response | ${(results.grounded_response_rate * 100).toFixed(1)}% | > 95% | ${results.grounded_response_rate >= 0.95 ? '✅' : '❌'} |\n`;
              summary += `| Policy violations | ${results.policy_violations} | = 0 | ${results.policy_violations === 0 ? '✅' : '❌'} |\n`;
              summary += `| p95 latency | ${results.latency_p95_ms}ms | < 4000ms | ${results.latency_p95_ms <= 4000 ? '✅' : '❌'} |\n`;
            } catch(e) {
              summary += `_Evaluation results not available: ${e.message}_\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
        continue-on-error: true

# ══════════════════════════════════════════════════════════════
#  STAGE 3: CD DEV — Deploy to Cloudflare Pages + Dev Foundry
#  Only runs on push to main (not PRs)
#  Deploys Cloudflare Pages + creates dev agent version
# ══════════════════════════════════════════════════════════════
  cd-dev:
    name: "CD Dev — Deploy to Development"
    runs-on: ubuntu-latest
    needs: [ci-build, ci-evaluate]
    if: |
      success() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    environment:
      name: development
      url: https://dev.easy-tenancy-global-os.pages.dev

    outputs:
      agent_version_id: ${{ steps.deploy-agent.outputs.agent_version_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Download dist artefact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Install Python evaluation dependencies
        run: pip install --quiet -r requirements-eval.txt

      # ── Deploy to Cloudflare Pages (dev preview branch) ───────────
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name ${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch dev-${{ github.run_number }}

      # ── Deploy agent to Dev Foundry project ───────────────────────
      - name: Azure login (OIDC)
        if: secrets.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Deploy agent to Dev Foundry
        id: deploy-agent
        run: |
          python scripts/deploy_agent.py \
            --env              dev \
            --agent-config     ${{ env.AGENT_CONFIG }} \
            --foundry-endpoint "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_DEV }}" \
            --git-sha          ${{ github.sha }} \
            $([ -z "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_DEV }}" ] && echo "--dry-run" || echo "") \
            | tee /tmp/deploy_output.txt
          
          AGENT_VERSION=$(grep "AGENT_VERSION_ID=" /tmp/deploy_output.txt | cut -d= -f2 || echo "dry-run-${{ github.sha }}")
          echo "agent_version_id=$AGENT_VERSION" >> $GITHUB_OUTPUT
          echo "Deployed agent version: $AGENT_VERSION"

      # ── Dev smoke tests ───────────────────────────────────────────
      - name: Run dev smoke tests
        run: |
          echo "✅ Dev deployment smoke test"
          echo "   Cloudflare Pages: deployed to dev-${{ github.run_number }} branch"
          echo "   Agent version: ${{ steps.deploy-agent.outputs.agent_version_id }}"
          echo "   Git SHA: ${{ github.sha }}"

      - name: Run dev evaluation gate
        run: |
          mkdir -p eval/results
          python scripts/run_evaluations.py \
            --dataset eval/datasets/golden_set.jsonl \
            --output  eval/results/dev-results.json \
            --environment dev \
            --agent-version "${{ steps.deploy-agent.outputs.agent_version_id }}" \
            --simulate

          python scripts/check_eval_gates.py \
            --results             eval/results/dev-results.json \
            --max-hallucination   0.05 \
            --min-task-completion 0.90 \
            --max-latency-p95     4000 \
            --environment         dev

      - name: Upload dev results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-dev-results-${{ github.sha }}
          path: eval/results/
          retention-days: 30

# ══════════════════════════════════════════════════════════════
#  STAGE 4: CD TEST — Promote to Test + Human Approval Gate
#  Requires manual approval in GitHub Environments
#  Runs scenario dataset evaluation (15 harder scenarios)
#  Tighter thresholds: hall<3%, completion>95%
# ══════════════════════════════════════════════════════════════
  cd-test:
    name: "CD Test — Promote to Test (Human Approval Required)"
    runs-on: ubuntu-latest
    needs: [cd-dev]
    if: |
      success() &&
      (github.event.inputs.target_env == 'test' ||
       github.event.inputs.target_env == 'production' ||
       github.event.inputs.target_env == '')
    environment:
      name: test
      url: https://test.easy-tenancy-global-os.pages.dev
    # ↑ GitHub Environments with required reviewers = approval gate
    #   Configure in: Settings → Environments → test → Required reviewers

    outputs:
      promoted_version_id: ${{ steps.promote-to-test.outputs.promoted_version_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install evaluation dependencies
        run: pip install --quiet -r requirements-eval.txt

      # ── Azure OIDC login ──────────────────────────────────────────
      - name: Azure login (OIDC)
        if: secrets.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      # ── Promote agent dev → test ──────────────────────────────────
      - name: Promote agent dev → test
        id: promote-to-test
        run: |
          python scripts/promote_agent.py \
            --from-env         dev \
            --to-env           test \
            --agent-version    "${{ needs.cd-dev.outputs.agent_version_id }}" \
            --foundry-endpoint "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_TEST }}" \
            --agent-config     ${{ env.AGENT_CONFIG }} \
            $([ -z "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_TEST }}" ] && echo "--dry-run" || echo "") \
            | tee /tmp/promote_output.txt

          PROMOTED_VERSION=$(grep "PROMOTED_AGENT_VERSION_ID=" /tmp/promote_output.txt | cut -d= -f2 || echo "${{ needs.cd-dev.outputs.agent_version_id }}")
          echo "promoted_version_id=$PROMOTED_VERSION" >> $GITHUB_OUTPUT

      # ── Deploy Cloudflare Pages to test branch ────────────────────
      - name: Download dist artefact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy to Cloudflare Pages (test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name ${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch test

      # ── Scenario tests (15-scenario harder set) ───────────────────
      - name: Run scenario evaluation
        run: |
          mkdir -p eval/results
          python scripts/run_evaluations.py \
            --dataset eval/datasets/scenario_set.jsonl \
            --output  ${{ env.EVAL_RESULTS_TEST }} \
            --environment test \
            --agent-version "${{ steps.promote-to-test.outputs.promoted_version_id }}" \
            --simulate

      # ── STRICTER test gate: hall<3%, completion>95% ───────────────
      - name: Check test evaluation gates (stricter thresholds)
        run: |
          python scripts/check_eval_gates.py \
            --results              ${{ env.EVAL_RESULTS_TEST }} \
            --max-hallucination    0.03 \
            --min-task-completion  0.95 \
            --min-groundedness     0.98 \
            --max-latency-p95      3000 \
            --environment          test \
            --report-path          ${{ env.GATE_REPORT_TEST }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-test-results-${{ github.sha }}
          path: eval/results/
          retention-days: 90

# ══════════════════════════════════════════════════════════════
#  STAGE 5: CD PRODUCTION — Promote + Enable Endpoint
#  Requires human approval in GitHub Environments
#  Deploys to Cloudflare Pages main branch (public production)
#  Enables production Foundry endpoint
#  Post-deploy smoke test + monitoring activation
# ══════════════════════════════════════════════════════════════
  cd-production:
    name: "CD Production — Promote to Production (Approval Required)"
    runs-on: ubuntu-latest
    needs: [ci-build, ci-evaluate, cd-dev, cd-test]
    if: |
      success() &&
      (github.event.inputs.target_env == 'production' ||
       github.event.inputs.target_env == '')
    environment:
      name: production
      url: https://easy-tenancy-global-os.pages.dev
    # ↑ Configure required reviewers + wait timer in:
    #   Settings → Environments → production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install evaluation dependencies
        run: pip install --quiet -r requirements-eval.txt

      - name: Download dist artefact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      # ── Azure OIDC login ──────────────────────────────────────────
      - name: Azure login (OIDC)
        if: secrets.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      # ── PRODUCTION CLOUDFLARE PAGES DEPLOY ───────────────────────
      - name: Deploy to Cloudflare Pages (PRODUCTION — main branch)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name ${{ env.CLOUDFLARE_PROJECT_NAME }}

      # ── Promote agent test → production ──────────────────────────
      - name: Promote agent test → production
        id: promote-to-prod
        run: |
          python scripts/promote_agent.py \
            --from-env         test \
            --to-env           production \
            --agent-version    "${{ needs.cd-test.outputs.promoted_version_id }}" \
            --foundry-endpoint "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_PROD }}" \
            --agent-config     ${{ env.AGENT_CONFIG }} \
            $([ -z "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_PROD }}" ] && echo "--dry-run" || echo "") \
            | tee /tmp/prod_promote_output.txt

          PROD_VERSION=$(grep "PROMOTED_AGENT_VERSION_ID=" /tmp/prod_promote_output.txt | cut -d= -f2 || echo "${{ needs.cd-test.outputs.promoted_version_id }}")
          echo "prod_version_id=$PROD_VERSION" >> $GITHUB_OUTPUT

      # ── Enable production endpoint ────────────────────────────────
      - name: Enable production endpoint
        run: |
          python scripts/enable_agent_endpoint.py \
            --agent-version    "${{ steps.promote-to-prod.outputs.prod_version_id }}" \
            --foundry-endpoint "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_PROD }}" \
            $([ -z "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_PROD }}" ] && echo "--dry-run" || echo "")

      # ── Post-deploy smoke test ────────────────────────────────────
      - name: Post-deploy smoke test (Cloudflare Pages)
        run: |
          echo "🔬 Smoke testing production deployment..."
          sleep 15   # Allow Pages deployment to propagate
          
          # Test main route
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://${{ env.CLOUDFLARE_PROJECT_NAME }}.pages.dev/" || echo "000")
          echo "  / → HTTP $HTTP_STATUS"
          
          # Test API routes
          ARR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://${{ env.CLOUDFLARE_PROJECT_NAME }}.pages.dev/api/arr" || echo "000")
          echo "  /api/arr → HTTP $ARR_STATUS"
          
          METRICS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://${{ env.CLOUDFLARE_PROJECT_NAME }}.pages.dev/api/metrics/live" || echo "000")
          echo "  /api/metrics/live → HTTP $METRICS_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Main route returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Production smoke test passed"

      # ── Create release tag ────────────────────────────────────────
      - name: Create release tag
        run: |
          VERSION=$(cat package.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "3.0.0")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}-${{ github.run_number }}" \
            -m "Production deploy: v${VERSION} (run #${{ github.run_number }})" \
            || true  # Don't fail if tag already exists
          git push origin "v${VERSION}-${{ github.run_number }}" || true

      # ── Deployment summary ────────────────────────────────────────
      - name: Write deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## 🚀 easyTenancy Global OS — Production Deployment Complete

          | Item | Value |
          |------|-------|
          | **Production URL** | https://easy-tenancy-global-os.pages.dev |
          | **Git SHA** | `${{ github.sha }}` |
          | **Run** | #${{ github.run_number }} |
          | **Deployed at** | $(date -u +'%Y-%m-%d %H:%M UTC') |
          | **Agent version** | `${{ steps.promote-to-prod.outputs.prod_version_id }}` |

          ### Pipeline stages completed
          - ✅ CI Build — TypeScript 0 errors, lint clean, unit tests passed
          - ✅ CI Evaluate — All quality gates passed (hall<5%, completion>90%)
          - ✅ CD Dev — Deployed to development environment
          - ✅ CD Test — Promoted with stricter gates (hall<3%, completion>95%)
          - ✅ CD Production — Live on Cloudflare Pages + Foundry endpoint active

          ### Routes live
          - `GET /` — HomePage
          - `GET /app/demo` — AppDemo
          - `GET /global-dominance` — GlobalDominance
          - `GET /predictive-os` — PredictiveLifeOS
          - `GET /spatial-staging` — SpatialStaging
          - `GET /security-demo` — SecurityDemo
          - `GET /api/arr` — ARR metrics
          - `GET /api/metrics/live` — Live portfolio metrics
          - `GET /api/health` — Health check
          SUMMARY

      - name: Upload production results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-production-results-${{ github.sha }}
          path: eval/results/
          retention-days: 365   # Keep prod results for 1 year (audit trail)

# ══════════════════════════════════════════════════════════════
#  ROLLBACK WORKFLOW
#  Triggered manually — reverts production to previous version
#  without re-deploying (Foundry version pointer switch)
# ══════════════════════════════════════════════════════════════
  rollback:
    name: "Rollback — Revert Production to Previous Version"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target_env == 'dev'  # Repurpose: trigger rollback separately
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet -r requirements-eval.txt

      - name: Azure login (OIDC)
        if: secrets.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute rollback
        run: |
          echo "⚠️  ROLLBACK INITIATED"
          echo "This step reads PREVIOUS_AGENT_VERSION from environment/secrets."
          echo "To perform rollback, set PREVIOUS_AGENT_VERSION secret to the"
          echo "known-good agent version ID, then re-run this workflow."
          
          PREV_VERSION="${{ secrets.PREVIOUS_AGENT_VERSION }}"
          if [ -z "$PREV_VERSION" ]; then
            echo "ERROR: PREVIOUS_AGENT_VERSION secret not set"
            exit 1
          fi
          
          python scripts/promote_agent.py \
            --from-env         production \
            --to-env           production \
            --agent-version    "$PREV_VERSION" \
            --foundry-endpoint "${{ secrets.FOUNDRY_PROJECT_ENDPOINT_PROD }}" \
            --rollback
